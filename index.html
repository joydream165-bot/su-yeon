
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUYEON | My Link</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #F1F0E9;
    color: #344638;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 70px 20px;
}

.container {
    max-width: 760px;
    margin: auto;
}

.top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
    font-size: 13px;
    letter-spacing: 2px;
}

.top span {
    color: #788675;
}

.main {
    background: #DDE5D8;
    border-radius: 22px;
    padding: 55px 45px;
}

.label {
    font-size: 12px;
    letter-spacing: 3px;
    color: #71836D;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(42px, 8vw, 68px);
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 20px;
    color: #304A37;
}

.description {
    font-size: 15px;
    color: #647565;
    line-height: 1.8;
    margin-bottom: 42px;
}

.section-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: #71836D;
    margin-bottom: 18px;
}

.link-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F8F7F1;
    padding: 23px 25px;
    border-radius: 12px;
    text-decoration: none;
    color: #344638;
    transition: 0.25s;
}

.link:hover {
    background: white;
    transform: translateY(-3px);
}

.link-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.number {
    font-size: 12px;
    color: #91A18C;
}

.link-name {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
}

.arrow {
    font-size: 20px;
    color: #71836D;
}

.footer {
    text-align: center;
    margin-top: 30px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #879183;
}

@media (max-width: 500px) {
    body { padding: 35px 16px; }
    .main { padding: 38px 22px; }
    .link { padding: 20px 16px; }
}
</style>
</head>

<body>
<div class="container">

    <div class="top">
        <strong>MY LINK ARCHIVE.</strong>
        <span>2026 / PERSONAL</span>
    </div>

    <main class="main">

        <div class="label">PERSONAL COLLECTION — 001</div>

        <h1>SUYEON.</h1>

        <p class="description">
            제가 자주 사용하는 링크들입니다.
        </p>

        <div class="section-title">MY FAVORITE LINKS</div>

        <div class="link-list">

            <a class="link" href="https://www.naver.com"
               target="_blank" rel="noopener noreferrer">
                <div class="link-left">
                    <span class="number">01</span>
                    <span class="link-name">NAVER</span>
                </div>
                <span class="arrow">↗</span>
            </a>

            <a class="link" href="https://www.google.com"
               target="_blank" rel="noopener noreferrer">
                <div class="link-left">
                    <span class="number">02</span>
                    <span class="link-name">GOOGLE</span>
                </div>
                <span class="arrow">↗</span>
            </a>

            <a class="link" href="https://www.youtube.com"
               target="_blank" rel="noopener noreferrer">
                <div class="link-left">
                    <span class="number">03</span>
                    <span class="link-name">YOUTUBE</span>
                </div>
                <span class="arrow">↗</span>
            </a>

        </div>
    </main>

    <div class="footer">
        DESIGNED BY SUYEON · 2026
    </div>

</div>
</body>
</html>
